name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------
      # 1. Checkout source code
      # --------------------------------

      - name: Checkout code
        uses: actions/checkout@v4


      # --------------------------------
      # 2. Setup Python
      # --------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # --------------------------------
      # 3. Upgrade pip
      # --------------------------------

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip


      # --------------------------------
      # 4. Install dependencies
      # --------------------------------

      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      # --------------------------------
      # 5. Check Python syntax
      # --------------------------------

      - name: Check syntax
        run: |
          python -m py_compile app.py


      # --------------------------------
      # 6. Run linting
      # --------------------------------

      - name: Run linting
        run: |
          flake8 app.py


      # --------------------------------
      # 7. Run tests
      # --------------------------------

      - name: Run tests
        run: |
          pytest -v